name: Package IDA Plugin 📦

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # keystone is vendored in plugins/patching/keystone, so one package works on every platform
    - name: Package plugin
      run: |
        mkdir dist
        cd plugins && zip -r ../dist/patching.zip . -x '*/__pycache__/*' '*.pyc'

    - uses: actions/upload-artifact@v4
      with:
        name: patching
        path: dist/patching.zip

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" dist/patching.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
